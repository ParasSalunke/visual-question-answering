services:
  - type: web
    name: vqa-studio-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: IMAGE_PROVIDER
        value: hf
      - key: LOW_MEMORY_MODE
        value: "true"
